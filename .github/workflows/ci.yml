name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # Installs the Python version from backend/.python-version and the locked packages;
      # fails if uv.lock is out of date with pyproject.toml.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff check)
        run: uv run --locked ruff check .

      - name: Format check (ruff format)
        run: uv run --locked ruff format --check .

      - name: Run tests
        run: uv run --locked pytest -q

      # The desktop API client is generated from this file, so a backend route change must re-export it.
      - name: Check the API description is up to date
        run: uv run --locked python -m scripts.export_openapi --check

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check the generated API types are up to date
        run: |
          npm run generate:api
          git diff --exit-code electron/api/schema.d.ts

      - name: Type-check the API client
        run: npm run typecheck

  # The boundary tests for letter case, short names, junctions and device names only run on Windows.
  boundary-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Run the boundary tests
        run: uv run --locked pytest -q tests/test_project_boundary.py
