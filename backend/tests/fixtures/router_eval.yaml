# 50 labelled messages for the router (P1-E5-T3): 13 general_chat, 13 project_question, 12 action_request,
# 12 multi_step. All invented; none comes from a real project. Some are in Arabic or French.
#
# The rules the labels follow:
#   general_chat      no files needed: greetings, writing, translation, maths, general knowledge
#   project_question  one lookup or one read in the user's files answers it
#   action_request    one change to files or folders (create, move, copy, rename, delete, organize)
#   multi_step        two or more steps before the answer: several lookups, many files, a comparison, or
#                     finding files and then changing them

# general_chat
- {message: "hi", route: general_chat}
- {message: "Thanks, that helps.", route: general_chat}
- {message: "What is the capital of Tunisia?", route: general_chat}
