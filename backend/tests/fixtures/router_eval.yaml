- {message: "Write a short cover letter for a research internship in genomics.", route: general_chat}
- {message: "What is 17 times 23?", route: general_chat}
- {message: "Explain what a REST API is in two sentences.", route: general_chat}
- {message: "Translate 'good morning' into Arabic and French.", route: general_chat}
- {message: "Give me three tips for a job interview.", route: general_chat}
- {message: "ما هي عاصمة تونس؟", route: general_chat}
- {message: "Peux-tu m'expliquer la différence entre la RAM et un disque dur ?", route: general_chat}
- {message: "Summarize this paragraph: the meeting moved to Friday because Karim is away.", route: general_chat}
- {message: "Tell me a joke about programmers.", route: general_chat}

